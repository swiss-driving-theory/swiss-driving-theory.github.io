<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cabin:wght@700&amp;display=swap');
      .astra-text {
        font-family: 'Cabin', Frutiger, 'Frutiger LT Std', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d11a33"/>
      <stop offset="100%" stop-color="#a01830"/>
    </linearGradient>
  </defs>

  <!-- App-Icon Hintergrund mit Farbverlauf -->
  <rect width="512" height="512" rx="0" fill="url(#bgGrad)" />
  
  <!-- "CH" Text perfekt zentriert im oberen Bereich (0 bis 383px, Mitte bei 191.5px) -->
  <text x="256" y="191.5" 
        class="astra-text"
        font-size="256" 
        text-anchor="middle" 
        dominant-baseline="central"
        fill="#FFFFFF" 
        letter-spacing="8">CH</text>
        
  <!-- Strassen-Führungslinie exakt nach Vorgabe -->
  <line x1="0" y1="383" x2="512" y2="383" 
        stroke="#FFFFFF" 
        stroke-width="26.1" 
        stroke-dasharray="102.4 102.4" />
</svg>
