<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiss Driving Theory</title>
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#C41E3A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192x192.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body data-page="home">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img class="logo-icon" src="./assets/icons/icon.svg" alt="">
        <span data-i18n="appName">Swiss Driving Theory</span>
      </a>
      <button class="hamburger" type="button" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav" aria-label="Primary">
        <a href="training.html" class="nav-btn" data-i18n="training">Training</a>
        <a href="exam.html" class="nav-btn" data-i18n="exam">Exam Simulation</a>
        <button type="button" class="nav-btn js-install-btn hidden" data-i18n="installApp">Install App</button>
        <label class="visually-hidden" for="lang-select">Language</label>
        <select id="lang-select" class="lang-select"></select>
      </nav>
    </div>
  </header>

  <div class="drawer-overlay" id="drawer-overlay">
    <div class="drawer" id="drawer">
      <button type="button" class="drawer-close" aria-label="Close menu" data-action="close-drawer">&times;</button>
      <nav class="drawer-nav" aria-label="Mobile">
        <a href="training.html" class="nav-btn" data-i18n="training">Training</a>
        <a href="exam.html" class="nav-btn" data-i18n="exam">Exam Simulation</a>
        <button type="button" class="nav-btn js-install-btn hidden" data-i18n="installApp">Install App</button>
      </nav>
      <label class="visually-hidden" for="drawer-lang-select">Language</label>
      <select id="drawer-lang-select" class="lang-select"></select>
    </div>
  </div>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="container">
        <h1 id="hero-title" data-i18n="appName">Swiss Driving Theory</h1>
        <p data-i18n="aboutText">Prepare for your driving theory exam with official ASA questions. Available in German, French, and Italian.</p>
        <div class="hero-actions">
          <a href="training.html" class="hero-btn hero-btn-primary" data-i18n="startTraining">Start Training</a>
          <a href="exam.html" class="hero-btn hero-btn-secondary" data-i18n="startExam">Exam Simulation</a>
        </div>
      </div>
    </section>

    <section class="section" aria-label="Statistics">
      <div class="container">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="total-questions">--</div>
            <div class="stat-label" data-i18n="totalQuestions">Total Questions</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="official-count">--</div>
            <div class="stat-label" data-i18n="officialASA">Official ASA</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">3</div>
            <div class="stat-label" data-i18n="languages">Languages</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">795</div>
            <div class="stat-label" data-i18n="images">Images</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <noscript>
    <div class="container section">
      <p>This application requires JavaScript to run. Please enable it to use the Swiss Driving Theory trainer.</p>
    </div>
  </noscript>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
