<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training — Swiss Driving Theory</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body data-page="training">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">CH</div>
        <span data-i18n="appName">Swiss Driving Theory</span>
      </a>
      <button class="hamburger" aria-label="Menu" onclick="window._app.toggleDrawer()">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav">
        <a href="index.html" class="nav-btn" data-i18n="home">Home</a>
        <a href="exam.html" class="nav-btn" data-i18n="exam">Exam</a>
        <select id="lang-select" class="lang-select"></select>
      </nav>
    </div>
  </header>

  <div class="drawer-overlay" id="drawer-overlay" onclick="window._app.closeDrawer()">
    <div class="drawer" id="drawer" onclick="event.stopPropagation()">
      <button class="drawer-close" aria-label="Close menu" onclick="window._app.closeDrawer()">&times;</button>
      <nav class="drawer-nav">
        <a href="index.html" class="nav-btn" data-i18n="home">Home</a>
        <a href="exam.html" class="nav-btn" data-i18n="exam">Exam</a>
      </nav>
      <select id="drawer-lang-select" class="lang-select"></select>
    </div>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" onclick="window._app.switchTab('quiz')" data-i18n="quiz">Quiz</button>
    <button class="mode-tab" onclick="window._app.switchTab('coaching')" data-i18n="coaching">Coaching</button>
    <button class="mode-tab" onclick="window._app.switchTab('browse')" data-i18n="browseStudy">Browse & Study</button>
  </div>

  <div id="quiz-view" class="training-view active">
    <div class="toolbar">
      <div class="container">
        <div class="toolbar-inner">
          <div class="toolbar-group">
            <span class="toolbar-label" data-i18n="officialQuestions">Official questions</span>
            <label class="toggle">
              <input type="checkbox" id="quiz-official" onchange="window._applyQuizFilters()">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </label>
          </div>
          <div class="toolbar-group">
            <span class="toolbar-label" data-i18n="category">Category</span>
            <select id="quiz-category" class="form-select" onchange="window._applyQuizFilters()">
              <option value="all" data-i18n="allCategories">All categories</option>
            </select>
          </div>
          <div class="toolbar-group">
            <button class="btn btn-sm btn-primary" onclick="window._quiz.resetQuiz()" data-i18n="restartQuiz">Restart Quiz</button>
          </div>
        </div>
      </div>
    </div>

    <div id="quiz-container">
      <div class="quiz-container text-center empty-state">
        <div class="empty-state-icon">?</div>
        <div class="empty-state-title" data-i18n="loadingQuestions">Loading questions...</div>
        <div class="empty-state-desc" data-i18n="fetchingQuestions">Fetching the latest questions from the server.</div>
      </div>
    </div>
  </div>

  <div id="coaching-view" class="training-view">
    <main class="container section-tight">
      <div id="coaching-container">
        <div class="empty-state">
          <div class="empty-state-icon">?</div>
          <div class="empty-state-title" data-i18n="loadingQuestions">Loading questions...</div>
          <div class="empty-state-desc" data-i18n="fetchingQuestions">Fetching the latest questions from the server.</div>
        </div>
      </div>
    </main>

    <div class="browse-modal-overlay" id="coaching-modal-overlay" onclick="window._coaching.closeBoxModalOutside(event)">
      <div class="browse-modal" id="coaching-modal">
        <button class="browse-modal-close" onclick="window._coaching.closeBoxModal()" aria-label="Close">&times;</button>
        <div id="coaching-modal-content"></div>
      </div>
    </div>
  </div>

  <div id="browse-view" class="training-view">
    <div id="browse-filters"></div>

    <main class="container section-tight">
      <div id="question-grid" class="question-grid">
        <div class="empty-state">
          <div class="empty-state-icon">?</div>
          <div class="empty-state-title" data-i18n="loadingQuestions">Loading questions...</div>
          <div class="empty-state-desc" data-i18n="fetchingQuestions">Fetching questions from the server.</div>
        </div>
      </div>
    </main>

    <div class="browse-modal-overlay" id="browse-modal-overlay" onclick="window._app.closeModalOutside(event)">
      <div class="browse-modal" id="browse-modal">
        <button class="browse-modal-close" onclick="window._app.closeDetail()" aria-label="Close">&times;</button>
        <div id="modal-content"></div>
      </div>
    </div>
  </div>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
