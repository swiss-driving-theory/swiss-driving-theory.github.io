<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training — Swiss Driving Theory</title>
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#C41E3A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192x192.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body data-page="training">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img class="logo-icon" src="./assets/icons/icon.svg" alt="">
        <span data-i18n="appName">Swiss Driving Theory</span>
      </a>
      <button class="hamburger" type="button" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav" aria-label="Primary">
        <a href="index.html" class="nav-btn" data-i18n="home">Home</a>
        <a href="exam.html" class="nav-btn" data-i18n="exam">Exam</a>
        <button type="button" class="nav-btn js-install-btn hidden" data-i18n="installApp">Install App</button>
        <label class="visually-hidden" for="lang-select">Language</label>
        <select id="lang-select" class="lang-select" ></select>
      </nav>
    </div>
  </header>

  <div class="drawer-overlay" id="drawer-overlay">
    <div class="drawer" id="drawer">
      <button type="button" class="drawer-close" aria-label="Close menu" data-action="close-drawer">&times;</button>
      <nav class="drawer-nav" aria-label="Mobile">
        <a href="index.html" class="nav-btn" data-i18n="home">Home</a>
        <a href="exam.html" class="nav-btn" data-i18n="exam">Exam</a>
        <button type="button" class="nav-btn js-install-btn hidden" data-i18n="installApp">Install App</button>
      </nav>
      <label class="visually-hidden" for="drawer-lang-select">Language</label>
      <select id="drawer-lang-select" class="lang-select" ></select>
    </div>
  </div>

  <div class="mode-tabs" role="tablist" aria-label="Training mode">
    <button type="button" id="tab-quiz" class="mode-tab active" data-tab="quiz" data-i18n="quiz" role="tab" aria-selected="true" aria-controls="quiz-view">Quiz</button>
    <button type="button" id="tab-coaching" class="mode-tab" data-tab="coaching" data-i18n="coaching" role="tab" aria-selected="false" aria-controls="coaching-view">Coaching</button>
    <button type="button" id="tab-browse" class="mode-tab" data-tab="browse" data-i18n="browseStudy" role="tab" aria-selected="false" aria-controls="browse-view">Browse & Study</button>
  </div>

  <main>
    <div id="quiz-view" class="training-view active" role="tabpanel" aria-labelledby="tab-quiz">
      <div class="toolbar">
        <div class="container">
          <div class="toolbar-inner">
            <div class="toolbar-group">
              <label class="toolbar-label" for="quiz-official" data-i18n="officialQuestions">Official questions</label>
              <label class="toggle">
                <input type="checkbox" id="quiz-official" data-action="apply-quiz-filters">
                <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
              </label>
            </div>
            <div class="toolbar-group">
              <label class="toolbar-label" for="quiz-category" data-i18n="category">Category</label>
              <select id="quiz-category" class="form-select" data-action="apply-quiz-filters">
                <option value="all" data-i18n="allCategories">All categories</option>
              </select>
            </div>
            <div class="toolbar-group">
              <button type="button" class="btn btn-sm btn-primary" id="restart-quiz-btn" data-i18n="restartQuiz">Restart Quiz</button>
            </div>
          </div>
        </div>
      </div>

      <div class="container section-tight">
        <div id="quiz-container">
          <div class="quiz-container text-center empty-state">
            <div class="empty-state-icon" aria-hidden="true">?</div>
            <div class="empty-state-title" data-i18n="loadingQuestions">Loading questions...</div>
            <div class="empty-state-desc" data-i18n="fetchingQuestions">Fetching the latest questions from the server.</div>
          </div>
        </div>
      </div>
    </div>

    <div id="coaching-view" class="training-view" role="tabpanel" aria-labelledby="tab-coaching">
      <div class="container section-tight">
        <div id="coaching-container">
          <div class="empty-state">
            <div class="empty-state-icon" aria-hidden="true">?</div>
            <div class="empty-state-title" data-i18n="loadingQuestions">Loading questions...</div>
            <div class="empty-state-desc" data-i18n="fetchingQuestions">Fetching the latest questions from the server.</div>
          </div>
        </div>
      </div>

      <div class="browse-modal-overlay" id="coaching-modal-overlay">
        <div class="browse-modal" id="coaching-modal" role="dialog" aria-modal="true" aria-labelledby="coaching-modal-title">
          <button type="button" class="browse-modal-close" data-action="close-coaching-modal" aria-label="Close">&times;</button>
          <div id="coaching-modal-content"></div>
        </div>
      </div>
    </div>

    <div id="browse-view" class="training-view" role="tabpanel" aria-labelledby="tab-browse">
      <div class="toolbar">
        <div class="container">
          <div id="browse-filters"></div>
        </div>
      </div>

      <div class="container section-tight">
        <div class="quiz-container">
          <div id="question-grid" class="question-grid">
            <div class="empty-state">
              <div class="empty-state-icon" aria-hidden="true">?</div>
              <div class="empty-state-title" data-i18n="loadingQuestions">Loading questions...</div>
              <div class="empty-state-desc" data-i18n="fetchingQuestions">Fetching questions from the server.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="browse-modal-overlay" id="browse-modal-overlay">
        <div class="browse-modal" id="browse-modal" role="dialog" aria-modal="true" aria-labelledby="browse-modal-title">
          <button type="button" class="browse-modal-close" data-action="close-modal" aria-label="Close">&times;</button>
          <div id="modal-content"></div>
        </div>
      </div>
    </div>
  </main>

  <noscript>
    <div class="container section">
      <p>This application requires JavaScript to run. Please enable it to use the Swiss Driving Theory trainer.</p>
    </div>
  </noscript>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
