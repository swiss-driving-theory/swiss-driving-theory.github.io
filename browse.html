<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse — Swiss Driving Theory</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">CH</div>
        <span>Swiss Driving Theory</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-btn">Home</a>
        <a href="quiz.html" class="nav-btn">Start Quiz</a>
        <select id="lang-select" class="lang-select" onchange="setLang(this.value)">
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="it">Italiano</option>
        </select>
      </nav>
    </div>
  </header>

  <div class="toolbar">
    <div class="container">
      <div class="toolbar-inner">
        <div class="toolbar-group">
          <span class="toolbar-label">Language</span>
          <select id="filter-lang" class="form-select" onchange="setLang(this.value); renderQuestionList(); if (selectedId) renderDetail(selectedId);">
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
          </select>
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">Official questions</span>
          <label class="toggle">
            <input type="checkbox" id="filter-official" onchange="applyBrowseFilters()">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">Category</span>
          <select id="filter-category" class="form-select" onchange="applyBrowseFilters()">
            <option value="all">All categories</option>
          </select>
        </div>
        <div class="toolbar-group">
          <button class="btn btn-sm btn-secondary" onclick="resetFilters()">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <main class="container section-tight">
    <div class="flex justify-between browse-header">
      <h2 class="section-title-lg">Question Reference</h2>
      <input type="text" id="browse-search" class="form-input search-input" placeholder="Search questions..." oninput="applyBrowseFilters()">
    </div>

    <div class="flex browse-layout">
      <div class="browse-grid-wrap">
        <div id="question-grid" class="question-grid">
          <div class="empty-state">
            <div class="empty-state-icon">?</div>
            <div class="empty-state-title">Loading questions...</div>
            <div class="empty-state-desc">Fetching questions from the server.</div>
          </div>
        </div>
      </div>
      <div id="detail-panel" class="detail-panel"></div>
    </div>
  </main>

  <script>
    var allQuestions = [];
    var filteredIds = [];
    var selectedId = null;
    var currentLang = "de";

    function setLang(lang) {
      currentLang = lang;
      try { localStorage.setItem("swiss-driving-theory-lang", lang); } catch(e) {}
    }

    function getCategoryLabel(catId) {
      var labels = {
        1: "Vehicle Equipment / Law",
        2: "Traffic Signs",
        3: "Traffic Signals / Behavior",
        4: "Overtaking / Turning",
        5: "Highway / Expressway",
        6: "Right of Way / Priority",
        7: "Parking",
        8: "Distances / Speed",
        9: "Vehicle Control / Situations",
        10: "Special Situations / Vulnerable Users",
        11: "Visibility / Lights",
        12: "Emergency / Accidents / Insurance"
      };
      return labels[catId] || "Category " + catId;
    }

    function getTypeLabel(type) {
      return type === "image" ? "Image" : "Text";
    }

    function getAnswerLabel(index) {
      return String.fromCharCode(96 + index);
    }

    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function truncate(text, maxLen) {
      maxLen = maxLen || 80;
      if (!text) return "";
      if (text.length <= maxLen) return text;
      return text.slice(0, maxLen).trim() + "...";
    }

    function getTranslation(q, lang) {
      if (!q || !q.translations) return null;
      return q.translations[lang] || q.translations["de"] || null;
    }

    async function loadData() {
      var resp = await fetch("assets/questions.json");
      if (!resp.ok) throw new Error("Failed to load questions.json: " + resp.status);
      var text = await resp.text();
      var data = JSON.parse(text);
      allQuestions = data.questions || [];
      return data;
    }

    function applyBrowseFilters() {
      var officialOnly = document.getElementById("filter-official").checked;
      var categoryVal = document.getElementById("filter-category").value;
      var categoryId = categoryVal === "all" ? null : Number(categoryVal);
      var search = document.getElementById("browse-search").value.toLowerCase();

      filteredIds = allQuestions
        .filter(q => {
          if (officialOnly && !q.official) return false;
          if (categoryId !== null && q.category !== categoryId) return false;
          if (search) {
            var t = getTranslation(q, currentLang);
            var text = (t && t.question ? t.question : "") + " " + (t && t.options ? t.options.join(" ") : "");
            if (text.toLowerCase().indexOf(search) === -1) return false;
          }
          return true;
        })
        .map(q => q.id);

      renderQuestionList();
    }

    function resetFilters() {
      filteredIds = allQuestions.map(q => q.id);
      selectedId = null;
      document.getElementById("browse-search").value = "";
      document.getElementById("filter-official").checked = false;
      document.getElementById("filter-category").value = "all";
      renderQuestionList();
      document.getElementById("detail-panel").innerHTML = "";
    }

    function renderQuestionList() {
      var grid = document.getElementById("question-grid");
      if (!grid) return;

      if (filteredIds.length === 0) {
        grid.innerHTML = '<div class="empty-state empty-state-full"><div class="empty-state-icon">0</div><div class="empty-state-title">No questions match your filters</div><div class="empty-state-desc">Try adjusting your search or filters above.</div></div>';
        return;
      }

      var html = "";
      for (var i = 0; i < filteredIds.length; i++) {
        var q = allQuestions.find(q => q.id === filteredIds[i]);
        if (!q) continue;
        var t = getTranslation(q, currentLang) || {};
        var text = truncate(t.question || "Question #" + q.id, 90);
        var imageHtml = q.questionImage
          ? '<img src="' + q.questionImage + '" alt="" class="question-card-image" loading="lazy">'
          : "";

        var selectedClass = (selectedId === q.id) ? " selected" : "";

        html += '<div class="question-card' + selectedClass + '" onclick="selectQuestion(' + q.id + ')">';
        html += '  <div class="question-card-header">';
        html += '    <span class="question-card-id">#' + q.id + ' &middot; ' + q.originalId + '</span>';
        html += '    <div class="flex gap-2">';
        if (q.official) html += '<span class="badge badge-official">Official</span>';
        html += '      <span class="badge badge-category">' + getCategoryLabel(q.category) + '</span>';
        html += '    </div>';
        html += '  </div>';
        html += imageHtml;
        html += '  <div class="question-card-text">' + escapeHtml(text) + '</div>';
        html += '  <div class="question-card-footer">';
        html += '    <span>' + getTypeLabel(q.type) + ' &middot; ' + q.answers.length + ' answers</span>';
        html += '  </div>';
        html += '</div>';
      }

      grid.innerHTML = html;
    }

    function selectQuestion(id) {
      selectedId = id;
      renderQuestionList();
      renderDetail(id);
    }

    function renderDetail(id) {
      var panel = document.getElementById("detail-panel");
      if (!panel) return;

      var q = allQuestions.find(q => q.id === id);
      if (!q) return;

      var t = getTranslation(q, currentLang) || {};
      var questionText = t.question || "";
      var options = t.options || [];
      var explanations = t.explanations || {};

      var html = '<div class="detail-view">';
      html += '  <div class="detail-header">';
      html += '    <div>';
      html += '      <h3 class="detail-question-text-lg">Question #' + q.id + ' &middot; ' + q.originalId + '</h3>';
      html += '      <div class="detail-meta">';
      if (q.official) html += '<span class="badge badge-official">Official</span>';
      html += '        <span class="badge badge-category">' + getCategoryLabel(q.category) + '</span>';
      html += '        <span class="badge badge-category">' + getTypeLabel(q.type) + '</span>';
      html += '      </div>';
      html += '    </div>';
      html += '    <button class="btn btn-sm btn-ghost" onclick="closeDetail()">Close</button>';
      html += '  </div>';

      if (q.questionImage) {
        html += '<img src="' + q.questionImage + '" alt="Question image" class="detail-image">';
      }

      if (questionText) {
        html += '<div class="detail-section"><div class="detail-section-title">Question</div><p class="detail-question-text">' + escapeHtml(questionText) + '</p></div>';
      }

      html += '<div class="detail-section"><div class="detail-section-title">Answers</div>';
      for (var i = 0; i < q.answers.length; i++) {
        var a = q.answers[i];
        var text = options[a.index - 1] || "Answer " + getAnswerLabel(a.index);
        var expl = a.paragraph ? explanations[a.paragraph] : null;
        var cls = "detail-answer";
        if (a.correct) cls += " correct";
        html += '<div class="' + cls + '">';
        html += '  <div class="detail-answer-label">' + (a.correct ? "&#10003;" : getAnswerLabel(a.index)) + '</div>';
        html += '  <div class="detail-answer-text">';
        html += '    <strong>' + escapeHtml(text) + '</strong>';
        if (expl) html += '<div class="detail-explanation">' + escapeHtml(expl) + '</div>';
        if (a.hidden) html += '<div class="hidden-text">(hidden)</div>';
        html += '  </div>';
        html += '</div>';
      }
      html += '</div>';
      html += '</div>';

      panel.innerHTML = html;
      panel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function closeDetail() {
      selectedId = null;
      document.getElementById("detail-panel").innerHTML = "";
      renderQuestionList();
    }

    async function init() {
      try {
        await loadData();
        populateCategorySelect();
        applyBrowseFilters();
      } catch (e) {
        console.error("Failed to load data:", e);
        document.getElementById("question-grid").innerHTML = '<div class="empty-state empty-state-full"><div class="empty-state-icon">!</div><div class="empty-state-title">Error loading quiz data</div><div class="empty-state-desc">' + escapeHtml(e.message) + '</div><div style="margin-top:16px;font-size:var(--text-sm);color:var(--text-muted);">Make sure you are running a local server (e.g., <code style="background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-family:var(--font-mono);">python -m http.server 3000</code>) and not opening the file directly.</div></div>';
      }
    }

    function populateCategorySelect() {
      var cats = {};
      for (var i = 0; i < allQuestions.length; i++) {
        cats[allQuestions[i].category] = true;
      }
      var sorted = Object.keys(cats).map(Number).sort(function(a, b) { return a - b; });
      var select = document.getElementById("filter-category");
      for (var i = 0; i < sorted.length; i++) {
        var opt = document.createElement("option");
        opt.value = sorted[i];
        opt.textContent = getCategoryLabel(sorted[i]);
        select.appendChild(opt);
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
