<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Simulation — Swiss Driving Theory</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body data-page="exam">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">CH</div>
        <span data-i18n="appName">Swiss Driving Theory</span>
      </a>
      <button class="hamburger" aria-label="Menu" onclick="window._app.toggleDrawer()">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav">
        <a href="index.html" class="nav-btn" data-i18n="home">Home</a>
        <a href="training.html" class="nav-btn" data-i18n="training">Training</a>
        <select id="lang-select" class="lang-select"></select>
      </nav>
    </div>
  </header>

  <div class="drawer-overlay" id="drawer-overlay" onclick="window._app.closeDrawer()">
    <div class="drawer" id="drawer" onclick="event.stopPropagation()">
      <button class="drawer-close" aria-label="Close menu" onclick="window._app.closeDrawer()">&times;</button>
      <nav class="drawer-nav">
        <a href="index.html" class="nav-btn" data-i18n="home">Home</a>
        <a href="training.html" class="nav-btn" data-i18n="training">Training</a>
      </nav>
      <select id="drawer-lang-select" class="lang-select"></select>
    </div>
  </div>

  <div class="container section-tight">
    <div class="exam-header">
      <div class="exam-title-group">
        <h2 class="section-title-lg" data-i18n="examSimulation">Exam Simulation</h2>
        <div class="progress-text" id="exam-counter">Question 1 of 50</div>
      </div>
      <div class="exam-actions">
        <div class="exam-timer" id="exam-timer">45:00</div>
        <button class="btn btn-primary" onclick="window._exam.finishExam()" data-i18n="finishExam">Finish Exam</button>
      </div>
    </div>

    <div class="exam-palette" id="exam-palette"></div>

    <div id="exam-container">
      <div class="quiz-container text-center empty-state">
        <div class="empty-state-icon">?</div>
        <div class="empty-state-title" data-i18n="loadingQuestions">Loading questions...</div>
        <div class="empty-state-desc" data-i18n="preparingExam">Preparing your exam simulation.</div>
      </div>
    </div>
  </div>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
