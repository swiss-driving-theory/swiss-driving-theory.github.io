<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Simulation — Swiss Driving Theory</title>
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#C41E3A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192x192.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body data-page="exam">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img class="logo-icon" src="./assets/icons/icon.svg" alt="">
        <span data-i18n="appName">Swiss Driving Theory</span>
      </a>
      <button class="hamburger" type="button" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav" aria-label="Primary">
        <a href="index.html" class="nav-btn" data-i18n="home">Home</a>
        <a href="training.html" class="nav-btn" data-i18n="training">Training</a>
        <button type="button" class="nav-btn js-install-btn hidden" data-i18n="installApp">Install App</button>
        <label class="visually-hidden" for="lang-select">Language</label>
        <select id="lang-select" class="lang-select" ></select>
      </nav>
    </div>
  </header>

  <div class="drawer-overlay" id="drawer-overlay">
    <div class="drawer" id="drawer">
      <button type="button" class="drawer-close" aria-label="Close menu" data-action="close-drawer">&times;</button>
      <nav class="drawer-nav" aria-label="Mobile">
        <a href="index.html" class="nav-btn" data-i18n="home">Home</a>
        <a href="training.html" class="nav-btn" data-i18n="training">Training</a>
        <button type="button" class="nav-btn js-install-btn hidden" data-i18n="installApp">Install App</button>
      </nav>
      <label class="visually-hidden" for="drawer-lang-select">Language</label>
      <select id="drawer-lang-select" class="lang-select" ></select>
    </div>
  </div>

  <main>
    <div class="container section-tight">
      <div class="exam-header">
        <div class="exam-title-group">
          <h1 class="section-title-lg" data-i18n="examSimulation">Exam Simulation</h1>
          <div class="progress-text" id="exam-counter" aria-live="polite">Question 1 of 50</div>
        </div>
        <div class="exam-actions">
          <div class="exam-timer" id="exam-timer" role="timer" aria-live="off" aria-atomic="true">45:00</div>
          <button type="button" class="btn btn-primary" id="finish-exam-btn" data-i18n="finishExam">Finish Exam</button>
        </div>
      </div>

      <div class="exam-palette" id="exam-palette" aria-label="Question palette"></div>

      <div id="exam-container">
        <div class="quiz-container text-center empty-state">
          <div class="empty-state-icon" aria-hidden="true">?</div>
          <div class="empty-state-title" data-i18n="loadingQuestions">Loading questions...</div>
          <div class="empty-state-desc" data-i18n="preparingExam">Preparing your exam simulation.</div>
        </div>
      </div>
    </div>
  </main>

  <noscript>
    <div class="container section">
      <p>This application requires JavaScript to run. Please enable it to use the Swiss Driving Theory trainer.</p>
    </div>
  </noscript>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
